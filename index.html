<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="空壳网站 —— 结构已就位，内容随时填入。" />
  <title>空壳网站 · Shell Site</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1f2430;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .logo { font-weight: 700; font-size: 18px; letter-spacing: 1px; }
    .logo span { color: var(--accent); }
    nav a {
      margin-left: 24px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }
    nav a:hover { color: var(--accent); }
    main {
      flex: 1;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 64px 24px;
    }
    .hero {
      text-align: center;
      padding: 48px 0 56px;
    }
    .hero h1 { font-size: 40px; margin-bottom: 16px; }
    .hero p { color: var(--muted); font-size: 17px; line-height: 1.8; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
    }
    .card .icon {
      width: 44px; height: 44px;
      margin: 0 auto 14px;
      border-radius: 10px;
      background: #eef2ff;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .card h3 { font-size: 16px; margin-bottom: 8px; }
    .card p { color: var(--muted); font-size: 13px; line-height: 1.7; }
    footer {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">SHELL<span>SITE</span></div>
    <nav>
      <a href="#">首页</a>
      <a href="#">占位栏目一</a>
      <a href="#">占位栏目二</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>空壳网站</h1>
      <p>骨架已就位，内容待填入。<br />这是一个干净的起点：头部、导航、主区、卡片、页脚一应俱全。</p>
    </section>

    <section class="grid">
      <div class="card">
        <div class="icon">📄</div>
        <h3>页面结构</h3>
        <p>单文件 HTML，无任何外部依赖，改起来最省心。</p>
      </div>
      <div class="card">
        <div class="icon">🧩</div>
        <h3>模块占位</h3>
        <p>卡片区域可替换为你的功能入口、文章列表或产品展示。</p>
      </div>
      <div class="card">
        <div class="icon">🚀</div>
        <h3>随时部署</h3>
        <p>静态页面直连 GitHub Pages，改完推送即上线。</p>
      </div>
    </section>
  </main>

  <footer>
    © 2026 Shell Site · 空壳网站 · 由 GitHub Pages 托管
  </footer>
</body>
</html>
