<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="市场情绪看板 —— VIX 实时观测，数据来自 CBOE 官方。" />
  <title>✧ 市场情绪看板 · VIX 观测所 ✧</title>
  <style>
    :root {
      --bg-top: #ffe9f5;
      --bg-mid: #f2e9ff;
      --bg-bottom: #e2f2ff;
      --panel: rgba(255, 255, 255, 0.78);
      --ink: #5a4a66;
      --muted: #9b8aa8;
      --line: #ffd7ec;
      --accent: #ff7eb6;
      --accent2: #a78bfa;
      --up: #e11d48;
      --down: #0d9488;
      --shadow: 0 6px 22px rgba(255, 126, 182, 0.16);
      --radius: 18px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      font-family: "Yuanti SC", "YouYuan", "幼圆", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(255,233,245,.72) 0%, rgba(242,233,255,.66) 48%, rgba(226,242,255,.78) 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    /* 二次元场景背景：固定层，不随滚动，渐变遮罩保证文字可读 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url('./img/bg.webp') center top / cover no-repeat;
      pointer-events: none;
    }

    /* ===== 樱花 ===== */
    .sakura { position: fixed; top: -40px; z-index: 0; pointer-events: none; user-select: none; animation: fall linear infinite; }
    .sakura i { display: block; font-style: normal; animation: sway ease-in-out infinite alternate; }
    @keyframes fall { to { transform: translateY(110vh) rotate(300deg); } }
    @keyframes sway { from { transform: translateX(-14px) rotate(-18deg); } to { transform: translateX(14px) rotate(22deg); } }
    @media (prefers-reduced-motion: reduce) { .sakura { display: none; } }

    /* ===== 顶栏 ===== */
    header {
      position: sticky; top: 8px; z-index: 5;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin: 8px 14px 0; padding: 9px 18px;
      background: var(--panel);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
    }
    .logo {
      font-weight: 700; font-size: 16px; letter-spacing: .5px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap;
    }
    nav a { margin-left: 14px; color: var(--muted); text-decoration: none; font-size: 13px; white-space: nowrap; }
    nav a:hover { color: var(--accent); }

    main {
      position: relative; z-index: 1; flex: 1;
      max-width: 1000px; width: 100%; margin: 0 auto; padding: 14px 16px 40px;
    }

    /* ===== 小 Banner ===== */
    .hero {
      position: relative; border-radius: var(--radius); overflow: hidden;
      border: 3px solid #fff; box-shadow: var(--shadow);
      background: url("./img/banner.webp") center 26% / cover no-repeat;
      min-height: clamp(108px, 13vw, 148px);
      display: flex; align-items: center;
      margin-bottom: 14px;
    }
    /* ===== 卡片通用 ===== */
    .card {
      background: var(--panel);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 2px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* ===== 方形卡片墙 ===== */
    .wall {
      display: grid;
      /* min() 保证轨道永不宽于容器，避免被内容 min-content 撑破 */
      grid-template-columns: repeat(auto-fill, minmax(min(248px, 100%), 1fr));
      gap: 14px;
      align-items: stretch;   /* 同行卡片等高 */
    }
    .tile {
      aspect-ratio: 1 / 1;          /* 首选正方形，装不下时自动撑高 */
      min-height: 236px;
      min-width: 0;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      position: relative;
      container-type: inline-size;
      transition: transform .22s ease, box-shadow .22s ease;
    }
    .tile:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255,126,182,.26); }

    /* 卡片内部统一骨架：头部 / 数值区 / 主体区(弹性) / 底部(贴底) */
    .tile-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; flex: none; flex-wrap: wrap; min-height: 40px; }
    .tile-title { font-weight: 700; font-size: 14px; line-height: 1.35; flex: 1; min-width: 0; }
    .tile-title .sub { display: block; color: var(--muted); font-weight: 400; font-size: 10.5px; margin-top: 2px; }
    .badge {
      font-size: 11px; padding: 3px 10px; border-radius: 999px;
      border: 2px solid var(--line); color: var(--muted); background: #fff; white-space: nowrap; flex: none;
    }
    .b-red    { color: var(--up);   border-color: #fecdd3; background: #fff1f2; }
    .b-orange { color: #d97706;     border-color: #fde68a; background: #fffbeb; }
    .b-green  { color: var(--down); border-color: #99f6e4; background: #f0fdfa; }

    /* 数值区：固定高度，保证两卡同一水平线 */
    .tile-mid { flex: none; display: flex; flex-direction: column; justify-content: center; padding: 6px 0 8px; min-height: 70px; }
    .vix-price { font-size: clamp(36px, 8vw, 48px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
    .vix-chg { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 7px; white-space: nowrap; }
    .up   { color: var(--up); }    /* 涨：红（A股惯例） */
    .down { color: var(--down); }  /* 跌：绿 */
    .flat { color: var(--muted); }

    /* 主体区：弹性，内容垂直居中 —— 底部区块因此天然对齐 */
    .tile-body { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; min-height: 0; }

    .spark-link { display: block; text-decoration: none; margin: 0; }
    .spark-link svg { width: 100%; height: 52px; display: block; }
    .spark-link .cap { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 10px; margin-top: 3px; flex-wrap: wrap; }
    .spark-link:hover .cap { color: var(--ink); }

    .tile-foot { margin-top: auto; padding-top: 10px; flex: none; }
    .tile-time { color: var(--muted); font-size: 11px; margin-bottom: 7px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .btn {
      border: 2px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: all .2s ease; text-decoration: none; white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: .5; cursor: wait; }
    .btn.detail { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; margin-left: auto; }
    .vix-err { color: #d97706; font-size: 10px; width: 100%; }

    /* ===== A股恐贪指数 ===== */
    .fg-scale {
      position: relative; height: 10px; border-radius: 999px;
      background: linear-gradient(90deg, #e11d48 0%, #f97316 26%, #fbbf24 46%, #a3e635 62%, #16a34a 100%);
      margin: 2px 3px 5px;
      box-shadow: inset 0 0 0 1px rgba(90, 74, 102, .08);
    }
    .fg-scale i {
      position: absolute; top: 50%; left: 50%; width: 5px; height: 20px; border-radius: 3px;
      background: var(--ink); box-shadow: 0 0 0 2px #fff;
      transform: translate(-50%, -50%);
      transition: left .6s ease;
    }
    .fg-scale-lbl {
      display: flex; justify-content: space-between;
      font-size: 10px; color: var(--muted); margin-bottom: 6px;
    }
    .fg-c1 { color: #e11d48; }
    .fg-c2 { color: #f97316; }
    .fg-c3 { color: #5a4a66; }
    .fg-c4 { color: #65a30d; }
    .fg-c5 { color: #16a34a; }
    .bg-c1 { color: #e11d48; border-color: #fecdd3; background: #fff1f2; }
    .bg-c2 { color: #f97316; border-color: #fed7aa; background: #fff7ed; }
    .bg-c3 { color: #5a4a66; border-color: #efe6f5; background: #fdfaff; }
    .bg-c4 { color: #65a30d; border-color: #d9f99d; background: #f7fee7; }
    .bg-c5 { color: #16a34a; border-color: #bbf7d0; background: #f0fdf4; }
    .fg-list-title { font-size: 10px; color: var(--muted); margin: 6px 0 3px; }
    .fg-list { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 10.5px; margin-top: 5px; }
    .fg-item { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
    .fg-item b { font-weight: 400; color: var(--muted); white-space: nowrap; }
    .fg-item i { font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ===== 自适应：卡片越窄，排版越紧凑 ===== */
    @container (max-width: 300px) {
      .tile-title { font-size: 13px; }
      .vix-price { font-size: 34px; }
      .vix-chg { font-size: 14px; }
      .spark-link svg { height: 32px; }
      .spark-link .cap, .tile-time { font-size: 10px; }
      .btn { padding: 4px 10px; font-size: 11px; }
    }
    @container (max-width: 252px) {
      .tile-title .sub { display: none; }
      .vix-price { font-size: 30px; }
      .spark-link .cap { display: none; }
      .tile-time { margin-bottom: 6px; }
    }
    /* ===== 触摸设备优化 ===== */
    /* 触摸屏没有真正的 hover，点完会「卡住」在悬浮态 —— 取消 hover 效果，改用按下反馈 */
    @media (hover: none) {
      .tile:hover { transform: none; box-shadow: var(--shadow); }
      .btn:hover { border-color: var(--line); color: var(--ink); }
      .btn.detail:hover { color: #fff; }
      nav a:hover { color: var(--muted); }
      .spark-link:hover { color: var(--muted); }
      .spark-link:hover .arrow { transform: none; }
    }
    .tile:active { transform: scale(.985); }
    .btn:active { transform: scale(.96); }

    /* 窄屏：取消正方形、单列铺开、触控目标放大 */
    @media (max-width: 480px) {
      .tile { aspect-ratio: auto; min-height: 0; padding: 16px; }
      .wall { grid-template-columns: 1fr; gap: 12px; }
      main { padding: 12px 12px calc(28px + env(safe-area-inset-bottom)); }
      header { margin: 8px 8px 0; padding: 8px 14px; top: calc(6px + env(safe-area-inset-top)); }
      .logo { font-size: 13px; letter-spacing: 0; }
      nav a { font-size: 13px; margin-left: 12px; }
      .hero { min-height: 104px; border-width: 2px; border-radius: 14px; }
      .vix-price { font-size: 42px; }
      .vix-chg { font-size: 16px; }
      .badge { font-size: 12px; padding: 4px 12px; }
      /* 触控目标放大到 ≥40px 高 */
      .btn { padding: 9px 16px; font-size: 13px; }
      .tile-actions { gap: 8px; }
      .tile-time { font-size: 11.5px; }
      .spark-link svg { height: 52px; }
      .spark-link .cap { font-size: 11px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">✧ SAKURA SHELL ✧</div>
    <nav>
      <a href="./index.html">🌸 看板</a>
      <a href="./vix.html">📈 VIX 详情</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-hidden="true"></section>

    <div class="wall">
      <!-- VIX 方形卡 -->
      <section class="card tile" aria-label="VIX 恐慌指数">
        <div class="tile-top">
          <div class="tile-title">📈 VIX 恐慌指数<span class="sub">30 天隐含波动率 · SPX</span></div>
          <span class="badge" id="vixLevel">观测中…</span>
        </div>

        <div class="tile-mid">
          <div class="vix-price flat" id="vixPrice">--.--</div>
          <div class="vix-chg flat" id="vixChg">等待数据…</div>
        </div>

        <div class="tile-body">
          <a class="spark-link" href="./vix.html" title="查看 VIX 完整历史">
            <svg id="spark" viewBox="0 0 800 44" preserveAspectRatio="none" aria-label="VIX 近 30 日走势"></svg>
            <span class="cap">
              <span id="sparkLabel">近 30 日走势</span>
              <span>1990 至今 →</span>
            </span>
          </a>
        </div>

        <div class="tile-foot">
          <div class="tile-time" id="vixTime">最后成交：--</div>
          <div class="tile-actions">
            <span id="vixErr" class="vix-err"></span>
            <button class="btn" id="vixRefresh" type="button">✧ 刷新</button>
            <a class="btn detail" href="./vix.html">详细观测 →</a>
          </div>
        </div>
      </section>
      <!-- A股恐贪指数 -->
      <section class="card tile" aria-label="A股恐贪指数">
        <div class="tile-top">
          <div class="tile-title">🎭 A股恐贪指数<span class="sub">9 分项多维模型 · 含估值分位</span></div>
          <span class="badge" id="fgLevel">加载中…</span>
        </div>

        <div class="tile-mid">
          <div class="vix-price flat" id="fgScore">--</div>
          <div class="vix-chg flat" id="fgDelta">等待数据…</div>
        </div>

        <div class="tile-body">
          <div class="fg-scale" aria-hidden="true"><i id="fgMark"></i></div>
          <div class="fg-scale-lbl"><span>极度恐惧</span><span>中性</span><span>极度贪婪</span></div>
          <div class="fg-list" id="fgList"></div>
        </div>

        <div class="tile-foot">
          <div class="tile-time" id="fgTime">数据日期：--</div>
          <div class="tile-actions">
            <span id="fgErr" class="vix-err"></span>
            <button class="btn" id="fgRefresh" type="button">✧ 刷新</button>
            <a class="btn detail" href="./fng.html">各指数详情 →</a>
          </div>
        </div>
      </section>
      <!-- 后续指标卡直接往这里加，会自动铺成方格墙 -->
    </div>
  </main>

  <script>
  /* ===== 樱花飘落 ===== */
  (function () {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var GLYPHS = ['🌸', '❀', '✿', '🌸', '❀'];
    var colors = ['#ffb7d9', '#ffc7e5', '#f5c7ff', '#ffd6ea'];
    var COUNT = (window.innerWidth < 640) ? 8 : 14;   // 小屏减少粒子，省电省性能
    for (var i = 0; i < COUNT; i++) {
      var s = document.createElement('span');
      s.className = 'sakura';
      var dur = 9 + Math.random() * 10;
      s.style.left = (Math.random() * 100) + 'vw';
      s.style.fontSize = (10 + Math.random() * 15) + 'px';
      s.style.color = colors[Math.floor(Math.random() * colors.length)];
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (-Math.random() * dur) + 's';
      s.style.opacity = String(0.5 + Math.random() * 0.4);
      var inner = document.createElement('i');
      inner.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
      inner.style.animationDuration = (1.6 + Math.random() * 2) + 's';
      s.appendChild(inner);
      document.body.appendChild(s);
    }
  })();

  /* ===== VIX 卡片数据 ===== */
  (function () {
    'use strict';
    var REFRESH_SECONDS = 1;
    var left = 0, busy = false, hasData = false, backoff = false;
    var DATA_URL = './data/vix.json';   // 单指标实时快照

    var $ = function (id) { return document.getElementById(id); };
    var elPrice = $('vixPrice'), elChg = $('vixChg'), elTime = $('vixTime'), elLevel = $('vixLevel'),
        elErr = $('vixErr'), elBtn = $('vixRefresh');

    function setCls(el, c) { el.classList.remove('up', 'down', 'flat'); el.classList.add(c); }
    function f2(n, d) {
      return Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    function fmtTime(t) { return (t || '--').replace('T', ' '); }

    function levelInfo(v) {
      if (v >= 30) return ['极度恐慌 (╥﹏╥)', 'b-red'];
      if (v >= 20) return ['恐慌升温 (ﾟДﾟ;)', 'b-orange'];
      if (v >= 15) return ['情绪中性 (・_・;)', ''];
      return ['市场平静 (´▽`)', 'b-green'];
    }

    function render(d) {
      var price = parseFloat(d.price), prev = parseFloat(d.prev_close);
      var chg = parseFloat(d.change), pct = parseFloat(d.change_percent);
      if (!isFinite(price)) return;
      if (!isFinite(chg)) chg = price - prev;
      if (!isFinite(pct)) pct = prev ? (chg / prev) * 100 : 0;

      var dirCls = chg > 0 ? 'up' : (chg < 0 ? 'down' : 'flat');
      setCls(elPrice, dirCls);
      elPrice.textContent = f2(price, 2);
      if (chg === 0 && pct === 0) {
        elChg.textContent = '0.00 (0.00%)';
        setCls(elChg, 'flat');
      } else {
        var sign = chg > 0 ? '+' : '';
        elChg.textContent = sign + f2(chg, 2) + ' (' + sign + f2(pct, 2) + '%)';
        setCls(elChg, dirCls);
      }
      elTime.textContent = '最后成交 ' + fmtTime(d.last_trade_time).slice(5, 16) + '（美东）· CBOE';
      var info = levelInfo(price);
      elLevel.textContent = info[0];
      elLevel.className = 'badge ' + info[1];
      hasData = true;
    }

    function loadAll() {
      if (busy) return;
      busy = true; backoff = false;
      elBtn.disabled = true; elBtn.textContent = '刷新中…';
      fetch(DATA_URL + '?r=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) { render(d); elErr.textContent = ''; })
        .catch(function () {
          backoff = true;
          elErr.textContent = hasData ? '⚠ 数据源暂不可用，显示上次数据' : '⚠ 加载失败，稍后重试';
        })
        .finally(function () {
          busy = false; elBtn.disabled = false; elBtn.textContent = '✧ 刷新';
          left = backoff ? Math.max(REFRESH_SECONDS, 10) : REFRESH_SECONDS;
        });
    }

    /* ---------- 迷你走势（日频历史，低频更新） ---------- */
    /* ---------- 迷你走势（通用，uid 保证两卡的渐变 id 不冲突） ---------- */
    function drawMini(svgEl, labelEl, pts, uid) {
      if (!svgEl || !pts || !pts.length) return;
      var W = 800, H = 44, pl = 3, pr = 3, pt = 6, pb = 6;
      var vs = pts.map(function (p) { return p[1]; });
      var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
      if (mx === mn) { mx += 1; mn -= 1; }
      var pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
      var nx = function (i) { return pl + (pts.length === 1 ? 0 : i / (pts.length - 1) * (W - pl - pr)); };
      var ny = function (v) { return H - pb - (v - mn) / (mx - mn) * (H - pt - pb); };
      var line = '', area = '';
      pts.forEach(function (p, i) {
        var x = nx(i).toFixed(1), y = ny(p[1]).toFixed(1);
        line += (i ? 'L' : 'M') + x + ' ' + y;
        area += (i ? 'L' : 'M') + x + ' ' + y;
      });
      area += 'L' + nx(pts.length - 1).toFixed(1) + ' ' + H + 'L' + nx(0).toFixed(1) + ' ' + H + 'Z';
      svgEl.innerHTML =
        '<defs><linearGradient id="' + uid + 'L" x1="0" y1="0" x2="1" y2="0">' +
        '<stop offset="0%" stop-color="#ff7eb6"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>' +
        '<linearGradient id="' + uid + 'A" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#ff9ecb" stop-opacity="0.32"/>' +
        '<stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.03"/></linearGradient></defs>' +
        '<path d="' + area + '" fill="url(#' + uid + 'A)"/>' +
        '<path d="' + line + '" fill="none" stroke="url(#' + uid + 'L)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
      if (labelEl) {
        labelEl.textContent = '近 30 日走势（' + pts[0][0].slice(5) + ' ~ ' + pts[pts.length - 1][0].slice(5) + '）';
      }
    }

    function loadHistory() {
      fetch('./data/vix-history.json?r=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) { if (d && d.points && d.points.length) drawMini($('spark'), $('sparkLabel'), d.points.slice(-30), 'sp'); })
        .catch(function () {});
    }

    /* ---------- A股恐贪指数 ---------- */
    var elFgScore = $('fgScore'), elFgDelta = $('fgDelta'), elFgLevel = $('fgLevel'),
        elFgTime = $('fgTime'), elFgMark = $('fgMark'), elFgErr = $('fgErr'),
        elFgBtn = $('fgRefresh'), elFgList = $('fgList');

    function fgCls(s) {
      if (s < 20) return 1;
      if (s < 40) return 2;
      if (s < 60) return 3;
      if (s < 80) return 4;
      return 5;
    }

    function renderFg(d) {
      var list = d.indices || [];
      if (!list.length) return;
      var main = list[0];                       // 主指数（上证指数）
      var s = parseFloat(main.score);
      if (!isFinite(s)) return;
      var c = fgCls(s);

      elFgScore.textContent = s.toFixed(1);
      elFgScore.className = 'vix-price fg-c' + c;
      elFgLevel.textContent = main.rating_cn || '--';
      elFgLevel.className = 'badge bg-c' + c;
      elFgMark.style.left = Math.max(1, Math.min(99, s)) + '%';
      var pnum = main.parts ? Object.keys(main.parts).length : 0;
      elFgTime.textContent = '数据日期 ' + (d.date || '--') + (pnum ? ' · ' + pnum + ' 分项合成' : '');

      var pts = main.points || [];
      if (pts.length > 6) {
        var diff = s - parseFloat(pts[pts.length - 6][1]);
        var sign = diff > 0 ? '+' : '';
        elFgDelta.textContent = sign + diff.toFixed(1) + ' · 较 5 个交易日前';
        elFgDelta.className = 'vix-chg fg-c' + c;
      } else {
        elFgDelta.textContent = '';
      }

      if (elFgList) {
        elFgList.innerHTML = list.slice(1).map(function (it) {
          var cc = fgCls(parseFloat(it.score));
          return '<span class="fg-item"><b>' + it.name + '</b><i class="fg-c' + cc + '">'
            + parseFloat(it.score).toFixed(1) + '</i></span>';
        }).join('');
      }
    }

    function loadFg() {
      elFgBtn.disabled = true; elFgBtn.textContent = '刷新中…';
      fetch('./data/fear-greed.json?r=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) { renderFg(d); elFgErr.textContent = ''; })
        .catch(function () { elFgErr.textContent = '⚠ 加载失败'; })
        .finally(function () { elFgBtn.disabled = false; elFgBtn.textContent = '✧ 刷新'; });
    }

    elBtn.addEventListener('click', function () { loadAll(); loadHistory(); });
    setInterval(function () {
      if (busy) return;
      left -= 1;
      if (left <= 0) loadAll();
    }, 1000);
    setInterval(loadHistory, 60000);   // 历史为日频数据，每分钟重取一次即可

    elFgBtn.addEventListener('click', loadFg);
    setInterval(loadFg, 60000);        // 恐贪指数每日更新，低频即可

    loadAll();
    loadHistory();
    loadFg();
  })();
  </script>
</body>
</html>
